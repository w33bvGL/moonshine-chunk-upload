services:
  sandbox:
    build:
      context: .
    container_name: moonshine-chunk-upload-sandbox
    ports:
      - "${SANDBOX_PORT:-8000}:8000"
    volumes:
      - .:/var/www/package
      - sandbox-app:/var/www/sandbox
    environment:
      DEMO_PROJECT_REPO: ${DEMO_PROJECT_REPO:-https://github.com/moonshine-software/demo-project.git}
      DEMO_PROJECT_REF: ${DEMO_PROJECT_REF:-4.0}

volumes:
  sandbox-app:
